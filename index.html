<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>A Journey Through Space</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@200;300;400&family=Playfair+Display:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-deep: #020203;
    --text-primary: #f0e8d4;
    --glow-warm: rgba(255,225,180,0.08);
    --glow-cool: rgba(180,195,255,0.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;background:#020203;color:#f0e8d4;font-family:'Playfair Display','Cormorant Garamond',Georgia,serif;overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;user-select:none;-webkit-user-select:none}
  #starfield{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 3s ease}
  #nebulaBg{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 4s ease;background:radial-gradient(ellipse at 25% 35%,rgba(30,25,60,0.45) 0%,transparent 55%),radial-gradient(ellipse at 75% 65%,rgba(25,35,70,0.35) 0%,transparent 55%),radial-gradient(ellipse at 50% 85%,rgba(40,30,20,0.25) 0%,transparent 60%),linear-gradient(180deg,#040509 0%,#06080d 50%,#030508 100%)}
  #nebulaBg.active{opacity:1}
  .vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,0.6) 100%)}
  #solarSystem{position:fixed;inset:0;z-index:3;pointer-events:none;display:flex;align-items:center;justify-content:center;transform-origin:center center;transition:transform 6s cubic-bezier(0.25,0.1,0.25,1)}
  #sunGlow{position:absolute;width:0;height:0;border-radius:50%;background:radial-gradient(circle,rgba(255,180,60,0.7) 0%,rgba(255,140,30,0.3) 30%,rgba(255,100,20,0.08) 60%,transparent 100%);opacity:0;transition:opacity 3s ease,width 3s ease,height 3s ease;filter:blur(2px)}
  #earthContainer{position:absolute;opacity:0;transition:opacity 3s ease;will-change:transform}
  #earthDisk{width:0;height:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(80,160,220,0.9) 0%,rgba(30,90,160,0.85) 30%,rgba(15,50,90,0.8) 60%,rgba(10,30,60,0.7) 100%);box-shadow:0 0 40px rgba(80,160,220,0.3),0 0 80px rgba(60,140,200,0.15),0 0 120px rgba(40,100,180,0.08);position:relative;overflow:hidden;transition:width 3s ease,height 3s ease}
  #moonContainer{position:absolute;opacity:0;transition:opacity 4s ease,transform 8s cubic-bezier(0.25,0.1,0.25,1),left 8s cubic-bezier(0.25,0.1,0.25,1),top 8s cubic-bezier(0.25,0.1,0.25,1)}
  #moonDisk{width:0;height:0;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(240,235,220,0.95) 0%,rgba(210,200,180,0.9) 40%,rgba(180,170,150,0.8) 70%,rgba(140,130,110,0.7) 100%);box-shadow:0 0 30px rgba(240,230,210,0.4),0 0 60px rgba(230,215,190,0.2),0 0 100px rgba(220,200,170,0.1);transition:width 3s ease,height 3s ease}
  #symbolsContainer{position:fixed;inset:0;z-index:4;pointer-events:none}
  .floating-symbol{position:absolute;font-size:2rem;opacity:0;transition:opacity 3s ease;color:rgba(240,230,210,0.6);text-shadow:0 0 20px rgba(240,230,210,0.3)}
  .floating-symbol.visible{opacity:0.55}
  .floating-symbol.fading{opacity:0;transition:opacity 2.5s ease}
  #textOverlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:8vh 6vw;text-align:center;pointer-events:none}
  .msg-line{position:absolute;max-width:780px;width:min(86vw,780px);font-family:'Playfair Display',serif;font-weight:300;font-size:clamp(1.2rem,2.6vw,1.85rem);line-height:1.65;letter-spacing:0.015em;color:#f0e8d4;text-align:center;opacity:0;transform:translateY(16px);filter:blur(5px);transition:opacity 1.6s ease,transform 1.6s ease,filter 1.6s ease;text-shadow:0 0 20px rgba(255,230,195,0.10),0 0 40px rgba(200,185,255,0.06);white-space:pre-wrap;pointer-events:none}
  .msg-line.visible{opacity:1;transform:translateY(0);filter:blur(0)}
  .msg-line.fading{opacity:0;transform:translateY(-12px);filter:blur(4px);transition:opacity 1.4s ease,transform 1.4s ease,filter 1.4s ease}
  .msg-line.emph{font-family:'Cormorant Garamond','Playfair Display',serif;font-style:italic;font-size:clamp(2rem,4.8vw,3rem);letter-spacing:0.04em;text-shadow:0 0 30px rgba(255,220,180,0.2),0 0 60px rgba(210,195,255,0.12)}
  .msg-line.wow{font-family:'Cormorant Garamond','Playfair Display',serif;font-style:italic;font-size:clamp(2.4rem,5.4vw,3.5rem);letter-spacing:0.06em;color:#f6ecd8;text-shadow:0 0 35px rgba(255,215,175,0.25),0 0 70px rgba(210,190,255,0.15)}
  .msg-line.multi{line-height:1.8}
  #continueBtn,#musicBtn,#skipBtn{position:fixed;z-index:20;padding:0.75rem 2.2rem;background:transparent;border:1px solid rgba(240,230,212,0.3);color:#eee6d4;font-family:'Playfair Display',serif;font-size:1rem;font-weight:300;letter-spacing:0.12em;border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.5s ease,background 0.8s ease,border-color 0.8s ease,box-shadow 0.8s ease,letter-spacing 0.6s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #continueBtn{bottom:7vh;left:50%;transform:translateX(-50%)}
  #musicBtn{top:2.5vh;right:3vw;padding:0.55rem 1.4rem;font-family:'Inter','Playfair Display',sans-serif;font-size:0.8rem;border-color:rgba(240,230,212,0.25);color:#ccc4b4}
  #skipBtn{top:2.5vh;left:3vw;padding:0.55rem 1.4rem;font-family:'Inter','Playfair Display',sans-serif;font-size:0.8rem;border-color:rgba(240,230,212,0.2);color:rgba(204,196,180,0.7)}
  #continueBtn.visible,#musicBtn.visible,#skipBtn.visible{opacity:1;pointer-events:auto}
  #continueBtn:hover,#musicBtn:hover,#skipBtn:hover{background:rgba(240,230,212,0.07);border-color:rgba(240,230,212,0.55);box-shadow:0 0 40px rgba(240,230,212,0.12);letter-spacing:0.18em}
  #musicBtn.playing{border-color:rgba(240,230,212,0.45)}
  #blackScreen{position:fixed;inset:0;z-index:30;background:#000;opacity:1;pointer-events:all;transition:opacity 3s ease}
  #blackScreen.faded{opacity:0;pointer-events:none}
  #blackScreen.goBlack{opacity:1;pointer-events:all;transition:opacity 2s ease}
  #finalStarfield{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity 6s ease}
  #finalStarfield.active{opacity:1}
  @media(max-width:640px){
    .msg-line{line-height:1.55;font-size:clamp(1rem,3.8vw,1.4rem)}
    .msg-line.emph{font-size:clamp(1.6rem,6vw,2.2rem)}
    .msg-line.wow{font-size:clamp(1.8rem,7vw,2.5rem)}
    #continueBtn{padding:0.65rem 1.8rem;font-size:0.9rem;bottom:6vh}
    #musicBtn,#skipBtn{padding:0.45rem 1.2rem;font-size:0.75rem;top:2vh}
    .floating-symbol{font-size:1.4rem}
  }
  @media(max-width:380px){
    .msg-line{font-size:clamp(0.9rem,4.2vw,1.15rem)}
    .msg-line.emph{font-size:clamp(1.4rem,6.5vw,1.8rem)}
    .msg-line.wow{font-size:clamp(1.5rem,7.5vw,2rem)}
    #continueBtn{padding:0.55rem 1.5rem;font-size:0.8rem}
  }
</style>
</head>
<body>
<div id="nebulaBg"></div>
<canvas id="starfield"></canvas>
<div class="vignette"></div>
<div id="solarSystem"><div id="sunGlow"></div><div id="earthContainer"><div id="earthDisk"></div><div id="moonContainer"><div id="moonDisk"></div></div></div></div>
<div id="symbolsContainer"></div>
<canvas id="finalStarfield"></canvas>
<div id="textOverlay"></div>
<button id="continueBtn" aria-label="Continue">Continue</button>
<button id="musicBtn" aria-label="Play Music">Play Music</button>
<button id="skipBtn" aria-label="Skip">Skip</button>
<div id="blackScreen"></div>
<audio id="ambientAudio" loop preload="none"><source src="" type="audio/mpeg" /></audio>
<script>
/* ═══════════════════════════════════════════════════
   DOM REFS
   ═══════════════════════════════════════════════════ */
const nebulaBg=document.getElementById('nebulaBg'),
  starCanvas=document.getElementById('starfield'),
  solarSystem=document.getElementById('solarSystem'),
  sunGlow=document.getElementById('sunGlow'),
  earthCont=document.getElementById('earthContainer'),
  earthDisk=document.getElementById('earthDisk'),
  moonCont=document.getElementById('moonContainer'),
  moonDisk=document.getElementById('moonDisk'),
  symbolsCont=document.getElementById('symbolsContainer'),
  finalStarCnv=document.getElementById('finalStarfield'),
  textOverlay=document.getElementById('textOverlay'),
  continueBtn=document.getElementById('continueBtn'),
  musicBtn=document.getElementById('musicBtn'),
  skipBtn=document.getElementById('skipBtn'),
  blackScreen=document.getElementById('blackScreen');

/* ═══════════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════════ */
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let skip=false, musicOn=false;

function sunSz(){return Math.min(window.innerWidth,window.innerHeight)*0.45}
function earthSz(){return Math.min(window.innerWidth,window.innerHeight)*0.18}
function moonSz(){return earthSz()*0.27}

function setSz(el,sz){el.style.width=sz+'px';el.style.height=sz+'px'}

/* ═══════════════════════════════════════════════════
   STARFIELD
   ═══════════════════════════════════════════════════ */
function mkStars(cnv,density,alpha){
  const ctx=cnv.getContext('2d');
  let w=0,h=0,dpr=Math.min(devicePixelRatio||1,2),stars=[];
  function resize(){
    w=cnv.clientWidth=innerWidth;h=cnv.clientHeight=innerHeight;
    cnv.width=w*dpr;cnv.height=h*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.floor(w*h/density);
    stars=Array.from({length:n},()=>({
      x:Math.random()*w,y:Math.random()*h,
      r:Math.random()*1.4+0.2,
      a:Math.random()*alpha+0.1,
      tw:Math.random()*0.012+0.002,
      phase:Math.random()*Math.PI*2,
      vx:(Math.random()-0.5)*0.04,
      vy:(Math.random()-0.5)*0.04,
      hue:Math.random()<0.1?38:Math.random()<0.5?215:32
    }));
  }
  function draw(t){
    ctx.clearRect(0,0,w,h);
    for(const s of stars){
      s.phase+=s.tw;s.x+=s.vx;s.y+=s.vy;
      if(s.x<-10)s.x=w+10;if(s.x>w+10)s.x=-10;
      if(s.y<-10)s.y=h+10;if(s.y>h+10)s.y=-10;
      const a=s.a*(0.5+0.5*Math.sin(s.phase));
      const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*5);
      g.addColorStop(0,`hsla(${s.hue},35%,92%,${a})`);
      g.addColorStop(1,`hsla(${s.hue},35%,92%,0)`);
      ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r*5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`hsla(${s.hue},25%,98%,${a})`;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener('resize',resize);
  resize();requestAnimationFrame(draw);
}

mkStars(starCanvas,9500,0.55);
mkStars(finalStarCnv,8000,0.45);

/* ═══════════════════════════════════════════════════
   TEXT DISPLAY
   ═══════════════════════════════════════════════════ */
async function showMsg(text,opts={}){
  const{hold=3500,emph=false,wow=false,multi=false}=opts;
  const el=document.createElement('div');
  let cls='msg-line';
  if(emph)cls+=' emph';if(wow)cls+=' wow';if(multi)cls+=' multi';
  el.className=cls;
  el.innerHTML=text.replace(/\n/g,'<br/>');
  textOverlay.appendChild(el);
  await wait(50);
  el.classList.add('visible');
  await wait(1400);
  const h=wow?hold+3000:skip?Math.min(hold,800):hold;
  await wait(h);
  el.classList.add('fading');
  await wait(1200);
  el.remove();
}

/* ═══════════════════════════════════════════════════
   CONTINUE BUTTON
   ═══════════════════════════════════════════════════ */
let cr=null;
function showContinue(){return new Promise(r=>{cr=r;continueBtn.classList.add('visible')})}
function hideContinue(){continueBtn.classList.remove('visible');cr=null}
continueBtn.addEventListener('click',()=>{if(cr){hideContinue();cr()}});

/* ═══════════════════════════════════════════════════
   MUSIC — Web Audio soft ambient
   ═══════════════════════════════════════════════════ */
let ambNodes=null;
function startAmbient(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)(),
      o1=ctx.createOscillator(),o2=ctx.createOscillator(),
      g1=ctx.createGain(),g2=ctx.createGain(),mg=ctx.createGain();
    o1.type='sine';o1.frequency.value=174;
    o2.type='sine';o2.frequency.value=285;
    g1.gain.value=0.04;g2.gain.value=0.03;mg.gain.value=0.25;
    o1.connect(g1);g1.connect(mg);
    o2.connect(g2);g2.connect(mg);
    const l1=ctx.createOscillator(),lg1=ctx.createGain();
    l1.frequency.value=0.08;lg1.gain.value=15;
    l1.connect(lg1);lg1.connect(o1.frequency);
    const l2=ctx.createOscillator(),lg2=ctx.createGain();
    l2.frequency.value=0.11;lg2.gain.value=20;
    l2.connect(lg2);lg2.connect(o2.frequency);
    mg.connect(ctx.destination);
    o1.start();o2.start();l1.start();l2.start();
    ambNodes={ctx,o1,o2,l1,l2,mg};
  }catch(e){}
}
function stopAmbient(){
  if(ambNodes){
    try{ambNodes.o1.stop();ambNodes.o2.stop();ambNodes.l1.stop();ambNodes.l2.stop();ambNodes.ctx.close()}catch(e){}
    ambNodes=null;
  }
}
musicBtn.addEventListener('click',()=>{
  if(!musicOn){startAmbient();musicOn=true;musicBtn.textContent='Pause Music';musicBtn.classList.add('playing')}
  else{stopAmbient();musicOn=false;musicBtn.textContent='Play Music';musicBtn.classList.remove('playing')}
});

/* ═══════════════════════════════════════════════════
   SKIP
   ═══════════════════════════════════════════════════ */
skipBtn.addEventListener('click',()=>{
  skip=true;
  if(cr){hideContinue();cr()}
  skipBtn.style.opacity='0.3';
});

/* ═══════════════════════════════════════════════════
   VISUALS
   ═══════════════════════════════════════════════════ */
function showSun(v,szMult=1){
  const sz=sunSz()*szMult;
  setSz(sunGlow,sz*2.5);
  sunGlow.style.opacity=v;
}
function showEarth(v){
  setSz(earthDisk,earthSz());
  earthCont.style.opacity=v;
}
function showMoon(v){
  setSz(moonDisk,moonSz());
  moonCont.style.opacity=v;
}
function cam(x,y,z){
  solarSystem.style.transition='transform 6s cubic-bezier(0.25,0.1,0.25,1)';
  solarSystem.style.transform=`translate(${x}px,${y}px) scale(${z})`;
}
function posEarth(){
  const w=innerWidth,h=innerHeight;
  earthCont.style.left=(w*0.46)+'px';
  earthCont.style.top=(h*0.40)+'px';
  moonCont.style.left=(earthSz()*1.3)+'px';
  moonCont.style.top=(earthSz()*0.25)+'px';
}

/* ═══════════════════════════════════════════════════
   SYMBOLS
   ═══════════════════════════════════════════════════ */
const SYMS=[
  '\u271D','\u263C','\u0950','\u2638','\u2721','\u0F52','\u262F','\u2733'
];
function createSymbols(){
  const w=innerWidth,h=innerHeight,cx=w/2,cy=h/2,r=Math.min(w,h)*0.35;
  SYMS.forEach((t,i)=>{
    const a=i/SYMS.length*Math.PI*2-Math.PI/2;
    const el=document.createElement('div');
    el.className='floating-symbol';
    el.textContent=t;
    el.style.left=(cx+Math.cos(a)*r)+'px';
    el.style.top=(cy+Math.sin(a)*r)+'px';
    el.style.transform=`translate(-50%,-50%)`;
    symbolsCont.appendChild(el);
  });
}
function showSymbols(v){
  const els=symbolsCont.querySelectorAll('.floating-symbol');
  els.forEach((el,i)=>{
    setTimeout(()=>{
      if(v){el.classList.add('visible');el.classList.remove('fading')}
      else{el.classList.add('fading');el.classList.remove('visible')}
    },i*200);
  });
}

/* ═══════════════════════════════════════════════════
   MAIN SEQUENCE
   ═══════════════════════════════════════════════════ */
async function run(){
  createSymbols();
  posEarth();

  // ── Opening: black screen, stars appear ──
  starCanvas.style.opacity='1';
  await wait(2500);
  nebulaBg.classList.add('active');
  await wait(1500);
  musicBtn.classList.add('visible');
  skipBtn.classList.add('visible');
  await wait(1000);

  // Solar system distant
  showSun('0.15',0.8);
  showEarth('0');
  showMoon('0');
  cam(0,0,0.7);
  await wait(2000);

  // Sun brightens
  showSun('0.35',0.8);
  await wait(2000);

  // ── Opening messages ──
  await showMsg('Welcome to another one of my weird online gifts for you.',{hold:3500});
  await wait(600);
  await showMsg("Hope you'll like it.",{hold:3000});
  await wait(800);

  // Camera moves toward Sun
  showSun('0.7',1.6);
  cam(0,-30,1.15);
  await wait(5000);

  // === ACT I — THE UNIVERSE ===
  await showMsg('Everything started from here.\n\nAfter this giant was born, our Solar System came to exist.',{hold:4200,multi:true});
  await wait(600);
  await showMsg('One of its creations\u2026',{hold:3000});

  // Camera travels from Sun to Earth
  showSun('0.15',0.3);
  const esz=earthSz();
  showEarth('1');
  cam(0,50,1.0);
  await wait(5500);

  // Earth messages
  await showMsg('Our Earth.\n\nHome to billions of different species.',{hold:3800,multi:true});
  await wait(500);
  await showMsg('One of them being us humans.',{hold:3200});
  await wait(500);
  await showMsg("We're one of evolution's weirdest creations.\n\nWe feel emotions.\nWe care about each other.\nWe do the strangest things just to make someone smile.\n\nSometimes, our entire day becomes better just by seeing one person.",{hold:5500,multi:true});
  await wait(600);

  // Religious symbols
  showSymbols(true);
  await wait(2000);
  await showMsg('These are symbols of different religions.\n\nEach with their own beliefs.\nEach with their own gods and deities.',{hold:4000,multi:true});
  await wait(400);
  await showMsg('People pray to them for different things.\n\nSome ask for success.\nSome ask for wealth.\nSome ask for love.\nSome simply ask for another tomorrow.',{hold:5000,multi:true});
  await wait(400);
  await showMsg("I don't know if anyone is listening.\n\nI don't know if destiny exists.\n\nI don't even know if there's a god.",{hold:4500,multi:true});
  await wait(600);
  showSymbols(false);
  await wait(2000);

  await showMsg('But\u2026',{hold:2800,emph:true});
  await wait(300);
  await showMsg('Even then\u2026\n\nSometimes I still find myself looking up at the sky\u2026\n\n\u2026asking for something.',{hold:4800,multi:true});
  await wait(500);
  await showMsg('Not for myself.',{hold:3000});
  await wait(400);
  await showMsg("I ask for the happiness\u2026\n\nof someone who isn't mine.",{hold:4200,multi:true});
  await wait(400);
  await showMsg("Someone who's simply beautiful.\n\nSomeone who's kind.\n\nSomeone whose smile somehow makes my day a little better.",{hold:5000,multi:true});
  await wait(400);
  await showMsg("I probably won't ever have her.",{hold:3500});
  await wait(400);
  await showMsg('But if I could just see you\u2026\n\neven if only for a little while\u2026\n\neven if only in my head\u2026',{hold:4800,multi:true});
  await wait(400);
  await showMsg('That would be enough to make my day.',{hold:3800});
  await wait(800);

  // Continue button pause
  await showContinue();

  // === ACT II — WHY HER? ===
  await showMsg('Why her?',{hold:3200,emph:true});
  await wait(400);
  await showMsg('Out of more than 8 billion people\u2026\n\n\u2026why her?',{hold:4200,multi:true});
  await wait(400);
  await showMsg("I don't know.\n\nMaybe it's simply because\u2026\n\nshe's Purnima.",{hold:4800,multi:true});
  await wait(400);
  await showMsg("Billions of years of history\u2026\n\nYet somehow\u2026\n\nwe exist in the very same moment.",{hold:4800,multi:true});
  await wait(400);
  await showMsg('The fact that\u2026\n\njust knowing her name\u2026\n\nmade me happy.',{hold:4500,multi:true});
  await wait(400);
  await showMsg('The fact that\u2026\n\nI still remember the first time I saw her.',{hold:4200,multi:true});
  await wait(400);
  await showMsg("There wasn't any background music.\n\nNo violins.\n\nNo slow-motion movie scene.",{hold:4800,multi:true});
  await wait(400);
  await showMsg('Just another ordinary day\u2026',{hold:3200});
  await wait(400);
  await showMsg('But to me\u2026\n\nit was beautiful.',{hold:4000,multi:true});
  await wait(800);

  await showContinue();

  // === ACT III — WHAT IF? ===
  await showMsg('What if\u2026?',{hold:3200,emph:true});
  await wait(400);
  await showMsg('What if\u2026\n\none day\u2026\n\nI got to call you mine?',{hold:4500,multi:true});
  await wait(400);
  await showMsg("I won't promise to make every day perfect.\n\nI won't promise that life will always be easy.",{hold:4500,multi:true});
  await wait(400);
  await showMsg("But\u2026\n\nI'd try.",{hold:3500,multi:true});
  await wait(400);
  await showMsg("I'd try to make you smile.\n\nI'd try to understand you.\n\nI'd try to be someone\u2026\n\nyou'd be happy to be around.",{hold:5200,multi:true});
  await wait(400);
  await showMsg("I can't gift you the world.",{hold:3200});
  await wait(400);
  await showMsg("I can't gift you the stars.",{hold:3200});
  await wait(1200);
  await showMsg('I mean\u2026\n\nYour name is Purnima.',{hold:3800,multi:true});

  // Moon rises from behind Earth
  showMoon('1');
  moonCont.style.transition='opacity 4s ease, left 8s cubic-bezier(0.25,0.1,0.25,1), top 8s cubic-bezier(0.25,0.1,0.25,1)';
  moonCont.style.left=(earthSz()*1.05)+'px';
  moonCont.style.top=(earthSz()*-0.15)+'px';
  await wait(4000);

  await showMsg("You're already the brightest thing\u2026\n\nin my night sky.",{hold:5000,multi:true,wow:true});

  // Fade everything to black
  showSun('0');
  showEarth('0');
  showMoon('0');
  nebulaBg.classList.remove('active');
  starCanvas.style.opacity='0';
  blackScreen.classList.add('goBlack');
  await wait(3000);

  // === FINALE ===
  // Wait ~3 seconds black
  await wait(3000);

  // Fade black screen out, reveal final starfield
  finalStarCnv.classList.add('active');
  await wait(3000);
  blackScreen.classList.remove('goBlack');
  blackScreen.classList.add('faded');
  await wait(2000);

  // Final messages on permanent starfield
  await showMsg("I don't know how to end this\u2026",{hold:3800});
  await wait(600);
  await showMsg('So just remember\u2026',{hold:3200});
  await wait(400);
  await showMsg('You are special to someone.\n\nSomeone\u2019s source of happiness.',{hold:4500,multi:true});
  await wait(600);
  await showMsg('Take care.\n\nAnd be happy.',{hold:5000,multi:true});

  // Final state — stars drift forever. No more text. No restart.
  // Continue button stays hidden. Music continues if playing.
  // The final starfield is already active and will persist.
}

run();
